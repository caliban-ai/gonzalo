[workspace]
resolver = "2"
members = [
    "crates/gonzalo-core",
    "crates/gonzalo-store-fs",
    "crates/gonzalo-store-git",
    "crates/gonzalo-store-s3",
    "crates/gonzalo-proto",
    "crates/gonzalo-server",
    "crates/gonzalo-store-server",
    "crates/gonzalo-domain",
    "crates/gonzalo",
    "crates/gonzalo-vector",
    "crates/gonzalo-embed",
    "crates/gonzalo-graph",
    "crates/gonzalo-graph-sqlite",
    "crates/gonzalo-ticket",
    "crates/gonzalo-ticket-github",
    "crates/gonzalo-ticket-config",
    "crates/gonzalo-ticket-jira",
    "crates/gonzalo-ticket-linear",
    "crates/gonzalo-ticket-gitlab",
    "crates/gonzalo-ticket-asana",
    "crates/gonzalo-knowledge",
    "crates/gonzalo-mcp",
    "crates/gonzalo-parse",
    "crates/gonzalo-cli",
    "crates/gonzalo-soak",
    "crates/gonzalo-integration-tests",
]

# The ANN head-to-head benchmark (hnsw_rs vs usearch, #9/ADR 0014) is excluded
# from the workspace: usearch bundles a C++ library, and keeping the bench out of
# `--workspace` means CI's `--all-features --all-targets` never compiles it. Run
# it manually: `cd crates/gonzalo-vector-bench && cargo run --release`.
exclude = ["crates/gonzalo-vector-bench"]

[workspace.package]
version = "0.3.0"
edition = "2024"
license = "AGPL-3.0-only"
authors = ["John Ford <john.ford2002@gmail.com>"]
rust-version = "1.95"
repository = "https://github.com/caliban-ai/gonzalo"

[workspace.dependencies]
gonzalo-core   = { path = "crates/gonzalo-core", version = "0.3.0" }
gonzalo-store-fs = { path = "crates/gonzalo-store-fs", version = "0.3.0" }
gonzalo-store-git = { path = "crates/gonzalo-store-git", version = "0.3.0" }
git2         = { version = "0.20", default-features = false }
gonzalo-store-s3 = { path = "crates/gonzalo-store-s3", version = "0.3.0" }
aws-config   = { version = "1", features = ["behavior-version-latest"] }
aws-sdk-s3   = { version = "1", default-features = false, features = ["rt-tokio", "rustls"] }
gonzalo-proto = { path = "crates/gonzalo-proto", version = "0.3.0" }
tonic       = "0.12"
prost       = "0.13"
tonic-build = "0.12"
protoc-bin-vendored = "3"
axum        = "0.8"
tokio-stream = { version = "0.1", features = ["net"] }
reqwest     = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
gonzalo-server = { path = "crates/gonzalo-server", version = "0.3.0" }
gonzalo-store-server = { path = "crates/gonzalo-store-server", version = "0.3.0" }
gonzalo-domain = { path = "crates/gonzalo-domain", version = "0.3.0" }
gonzalo-vector = { path = "crates/gonzalo-vector", version = "0.3.0" }
gonzalo-embed = { path = "crates/gonzalo-embed", version = "0.3.0" }
gonzalo-graph = { path = "crates/gonzalo-graph", version = "0.3.0" }
gonzalo-graph-sqlite = { path = "crates/gonzalo-graph-sqlite", version = "0.3.0" }
gonzalo-ticket = { path = "crates/gonzalo-ticket", version = "0.3.0" }
gonzalo-ticket-github = { path = "crates/gonzalo-ticket-github", version = "0.3.0" }
gonzalo-ticket-config = { path = "crates/gonzalo-ticket-config", version = "0.3.0" }
gonzalo-ticket-jira = { path = "crates/gonzalo-ticket-jira", version = "0.3.0" }
gonzalo-ticket-linear = { path = "crates/gonzalo-ticket-linear", version = "0.3.0" }
gonzalo-ticket-gitlab = { path = "crates/gonzalo-ticket-gitlab", version = "0.3.0" }
gonzalo-ticket-asana = { path = "crates/gonzalo-ticket-asana", version = "0.3.0" }
gonzalo-knowledge = { path = "crates/gonzalo-knowledge", version = "0.3.0" }
gonzalo-mcp   = { path = "crates/gonzalo-mcp", version = "0.3.0" }
gonzalo-parse = { path = "crates/gonzalo-parse", version = "0.3.0" }
gonzalo-cli   = { path = "crates/gonzalo-cli", version = "0.3.0" }
rmcp        = { version = "1.7", features = ["server", "transport-io", "macros"] }
tokio       = { version = "1", features = ["full"] }
async-trait = "0.1"
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
thiserror   = "1"
toml        = "0.8"
blake3      = "1"
rustix      = { version = "1", features = ["fs"] }
tempfile    = "3"
wiremock    = "0.6"
rusqlite    = { version = "0.32", features = ["bundled"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
