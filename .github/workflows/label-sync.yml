name: Sync labels
on:
  push:
    branches: [main]
    paths: ['.github/labels.yml']
  workflow_dispatch:
permissions:
  issues: write
  contents: read
jobs:
  labeler:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # The one action still on the deprecated Node 20 runtime: upstream has
      # published no Node 24 release (latest is v2.3.3). GitHub forces it onto
      # Node 24 and warns; revisit when upstream ships one (gonzalo#303).
      - uses: EndBug/label-sync@v2.3.3
        with:
          config-file: .github/labels.yml
          delete-other-labels: true
          token: ${{ secrets.GITHUB_TOKEN }}
