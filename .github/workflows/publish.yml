name: publish

# A `v*` tag drives TWO release workflows in lockstep off the same push:
#   - release-image.yml → builds & pushes the ghcr.io/caliban-ai/gonzalo image
#   - this workflow      → publishes the crate set to crates.io
# One tag, one release; image ↔ crate versions never drift. (The very first
# crates.io publish is run locally — see docs/releasing.md — because the
# new-crate rate limit exceeds a single CI run.)
on:
  push:
    tags:
      - "v*"

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    name: cargo publish --workspace
    # Guard 1: never run anywhere but the canonical public repo.
    if: github.repository == 'caliban-ai/gonzalo'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - name: Verify tag matches workspace version
        # Guard 3: tag v0.3.0 must equal the workspace package version. The
        # workspace version is carried by any member; read it off gonzalo-core
        # (a leaf lib present in every publishable configuration).
        run: |
          tag="${GITHUB_REF_NAME#v}"
          ws="$(cargo metadata --no-deps --format-version 1 \
                | jq -r '.packages[] | select(.name=="gonzalo-core") | .version')"
          echo "tag=$tag workspace=$ws"
          if [ "$tag" != "$ws" ]; then
            echo "::error::tag v$tag does not match workspace version $ws"
            exit 1
          fi

      - name: Publish to crates.io
        # Guard 2: token exists ONLY as a secret in caliban-ai/gonzalo (repo or
        # org). scripts/publish.sh publishes crates not yet on the registry, in
        # dependency order, with --no-verify (CI's package-check already verified
        # packaging — no recompile here). MAX_SLEEP_SECS=0 means the runner never
        # idles on a crates.io new-crate 429: it publishes what the burst allows
        # and exits non-zero. Finish the rest locally by running scripts/publish.sh
        # (which sleeps through the rate-limit windows for free). See docs/releasing.md.
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          MAX_SLEEP_SECS: "0"
        run: bash scripts/publish.sh
