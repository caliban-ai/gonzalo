# Single-node RustFS (S3-compatible) for the gonzalo HA soak (#52).
#
# RustFS is the soak's backend: it provides **atomic** If-Match conditional writes
# (soak-verified) and is Rust + Apache-2.0 (sustainable). Garage does NOT enforce
# If-Match atomically (see docs/superpowers/specs/2026-07-11-gonzalo-ha-soak-design.md)
# and is retained only as a reproducer of that finding.
#
# NOTE: RustFS is pre-1.0 (release candidate) — pinned for reproducibility. A
# Postgres substrate is tracked as the mature long-term HA backend (k8s epic #274).
#
# Brought up on demand by scripts/rustfs-up.sh.
services:
  rustfs:
    # Minimum rustfs/rustfs:1.0.0-rc.6. gonzalo#203's purge relies on an atomic
    # conditional DeleteObject (If-Match); 1.0.0-beta.8 is not atomic (it checks
    # If-Match on arrival but deletes whatever object is current when the removal
    # lands: 197/200 violations under concurrent create vs purge, 0/200 on rc.6).
    # To be recorded in ADR 0021 (replicated deletion, gonzalo#203 slice 7).
    # Do not downgrade.
    image: rustfs/rustfs:1.0.0-rc.6
    container_name: gonzalo-soak-rustfs
    restart: "no"
    environment:
      RUSTFS_ACCESS_KEY: rustfsadmin
      RUSTFS_SECRET_KEY: rustfsadmin
      RUSTFS_CONSOLE_ENABLE: "false"
    ports:
      - "127.0.0.1:9010:9000" # S3 API
    volumes:
      - rustfs-data:/data

  # One-shot: create the soak bucket over the compose network (works on both
  # Docker Desktop Mac and Linux CI — no host.docker.internal needed). Exits 0.
  createbucket:
    # Was `minio/mc`. Docker Hub stopped serving it ("pull access denied"),
    # which silently broke CI; quay.io still had a copy, but MinIO has stopped
    # publishing `mc` images at all, so that copy is a dead end too. The AWS CLI
    # is maintained, multi-arch, and speaks plain S3, which is all this needs
    # (gonzalo#286). Pinned by tag and digest.
    image: amazon/aws-cli:2.36.9@sha256:00dee8ccaf669721f8163944ea9e6ac13183851b23d5b7a9868a608bc932cfdb
    depends_on:
      - rustfs
    environment:
      AWS_ACCESS_KEY_ID: rustfsadmin
      AWS_SECRET_ACCESS_KEY: rustfsadmin
      AWS_DEFAULT_REGION: us-east-1
    entrypoint:
      - sh
      - -c
      - >
        until aws --endpoint-url http://rustfs:9000 s3api list-buckets >/dev/null 2>&1; do sleep 1; done &&
        aws --endpoint-url http://rustfs:9000 s3api create-bucket --bucket soak >/dev/null 2>&1 || true;
        aws --endpoint-url http://rustfs:9000 s3api head-bucket --bucket soak &&
        echo "gonzalo-soak: bucket ready"
    restart: "no"

volumes:
  rustfs-data:
