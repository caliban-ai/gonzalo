syntax = "proto3";

package gonzalo.v1;

// The Gonzalo daemon service. Payloads are JSON-encoded gonzalo-core types
// carried as bytes, so the protobuf schema stays small and the two
// transports (gRPC and HTTP/JSON) share one serialization.
service Gonzalo {
  rpc Get(GetRequest) returns (GetResponse);
  rpc Put(PutRequest) returns (PutResponse);
  rpc Delete(DeleteRequest) returns (DeleteResponse);
  rpc List(ListRequest) returns (ListResponse);
  rpc TicketSync(TicketSyncRequest) returns (TicketSyncResponse);
  // Code graph queries (EPIC C). Each selects a view by (repo, view_id).
  rpc GraphDefinitions(GraphQueryRequest) returns (GraphLocatedResponse);
  rpc GraphReferencesTo(GraphQueryRequest) returns (GraphLocatedResponse);
  rpc GraphCallersOf(GraphQueryRequest) returns (GraphNamesResponse);
  rpc GraphCallees(GraphQueryRequest) returns (GraphNamesResponse);
  rpc GraphImpact(GraphQueryRequest) returns (GraphNamesResponse);
}

message GetRequest {
  string namespace = 1;
  string collection = 2;
  string id = 3;
}

message GetResponse {
  bool found = 1;
  // JSON of gonzalo_core::Record when found.
  bytes record_json = 2;
}

message PutRequest {
  // JSON of gonzalo_core::Record.
  bytes record_json = 1;
  // JSON of Option<gonzalo_core::Revision> (the expected parent revision).
  bytes expected_json = 2;
}

message PutResponse {
  // "committed" or "conflict".
  string outcome = 1;
  // JSON of Revision (committed) or Conflict (conflict).
  bytes payload_json = 2;
}

message DeleteRequest {
  string namespace = 1;
  string collection = 2;
  string id = 3;
  // JSON of Option<gonzalo_core::Revision> (the expected current revision).
  bytes expected_json = 4;
}

message DeleteResponse {
  // "deleted" or "conflict".
  string outcome = 1;
  // Empty (deleted) or JSON of Conflict (conflict).
  bytes payload_json = 2;
}

message ListRequest {
  optional string namespace = 1;
  optional string collection = 2;
}

message ListResponse {
  // JSON of each RecordKey.
  repeated bytes keys_json = 1;
}

message TicketSyncRequest {
  // JSON of gonzalo_ticket_config::Connection.
  bytes connection_json = 1;
}

// Unlike the other responses (which carry bytes ..._json), the sync summary is
// three small counts, so they ride as plain numeric fields.
message TicketSyncResponse {
  uint64 imported = 1;
  uint64 updated = 2;
  uint64 unchanged = 3;
}

// --- Code graph queries (EPIC C) ---
// Every graph query selects a view by (repo, view_id): the daemon loads that
// view's manifest, assembles its slices, and answers server-side. `name` is the
// symbol the query is about. Wired to RPCs + transports in C3.
message GraphQueryRequest {
  string repo = 1;
  string view_id = 2;
  string name = 3;
}

// Definitions / ReferencesTo: located results (path + item).
message GraphLocatedResponse {
  // JSON of each gonzalo_graph::Located<Symbol> or Located<Reference>.
  repeated bytes items_json = 1;
}

// CallersOf / Callees / Impact: plain name lists.
message GraphNamesResponse {
  repeated string names = 1;
}
