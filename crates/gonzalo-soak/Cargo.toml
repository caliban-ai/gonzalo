[package]
name = "gonzalo-soak"
description = "HA soak harness: N stateless gonzalod replicas over an S3 backend under replica-kill chaos (gonzalo#52)"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
repository.workspace = true
# Internal HA chaos-soak harness (gonzalo#52) — not a consumable crate.
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "gonzalo-soak"
path = "src/main.rs"

[dependencies]
gonzalo-core = { workspace = true }
gonzalo-store-server = { workspace = true }
tokio = { workspace = true, features = ["full"] }
reqwest = { workspace = true }

[dev-dependencies]
async-trait = { workspace = true }
gonzalo-store-fs = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true
