[package]
name = "gonzalo-graph"
description = "Code-graph capability layer for gonzalo (tree-sitter symbol/reference index)"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
repository.workspace = true

[dependencies]
gonzalo-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tree-sitter = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-python = "0.25"
tree-sitter-javascript = "0.25"
tree-sitter-typescript = "0.23"
tree-sitter-go = "0.25"
tree-sitter-java = "0.23"
tree-sitter-c-sharp = "0.23"
tree-sitter-c = "0.24"
tree-sitter-cpp = "0.23"
tree-sitter-ruby = "0.23"
tree-sitter-php = "0.24"
tree-sitter-bash = "0.25"
tree-sitter-kotlin-ng = "1.1"
tree-sitter-swift = "0.7"
tree-sitter-lua = "0.5"
tree-sitter-scala = "0.26"
tree-sitter-elixir = "0.3.5"

[dev-dependencies]
gonzalo-store-fs = { workspace = true }
tokio = { workspace = true, features = ["rt", "macros"] }
tempfile = { workspace = true }

[features]
# Exposes `conformance::run_graph_store_conformance` for backend crates to
# validate their `GraphStore` impls against the reference semantics.
conformance = []

[lints]
workspace = true
