[package]
name = "gonzalo-parse"
description = "Crash-isolated code parsing: a worker subprocess pool around tree-sitter"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
repository.workspace = true

[dependencies]
gonzalo-graph = { workspace = true }
serde_json    = { workspace = true }
thiserror     = { workspace = true }
tokio         = { workspace = true, features = ["rt", "process", "io-util", "time", "sync", "macros"] }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }

[lints]
workspace = true

[[bin]]
name = "gonzalo-parse-worker"
path = "src/bin/gonzalo-parse-worker.rs"
