[package]
name = "gonzalo-mcp"
description = "MCP server exposing the gonzalo code graph to agents over stdio"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
repository.workspace = true

[dependencies]
gonzalo-core     = { workspace = true }
gonzalo-graph    = { workspace = true }
gonzalo-server   = { workspace = true }
gonzalo-store-fs = { workspace = true }
rmcp             = { workspace = true }
tokio            = { workspace = true, features = ["rt", "macros", "io-std"] }
serde            = { workspace = true }
serde_json       = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true

[[bin]]
name = "gonzalo-mcp"
path = "src/main.rs"
