[package]
name = "gonzalo-integration-tests"
description = "Cross-crate integration tests for the gonzalo workspace (remote client ↔ daemon ↔ store, code-graph over HTTP). Not published."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
repository.workspace = true
# Test-only harness: holds integration tests that wire several gonzalo crates
# together, so no shipped library dev-depends on the gonzalo-server binary or the
# heavy gonzalo-graph grammar set. Never published. (gonzalo#190 / #187)
publish = false

[lib]
path = "src/lib.rs"

[dev-dependencies]
gonzalo-core         = { workspace = true, features = ["conformance"] }
gonzalo-store-server = { workspace = true }
gonzalo-server       = { workspace = true }
gonzalo-store-fs     = { workspace = true }
gonzalo-graph        = { workspace = true }
tokio                = { workspace = true, features = ["rt-multi-thread", "macros", "net", "time"] }
reqwest              = { workspace = true }
tempfile             = { workspace = true }

[lints]
workspace = true
