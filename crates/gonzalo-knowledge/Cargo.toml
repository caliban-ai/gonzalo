[package]
name = "gonzalo-knowledge"
description = "Knowledge-store capability for gonzalo (records + vector + graph by RecordKey)"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
repository.workspace = true

[dependencies]
gonzalo-core   = { workspace = true }
gonzalo-domain = { workspace = true }
gonzalo-vector = { workspace = true }
# Optional: the vector⋈graph join (ADR 0011). A vector-only build stays lean.
gonzalo-graph  = { workspace = true, optional = true }

[dev-dependencies]
tokio            = { workspace = true }
async-trait      = { workspace = true }
gonzalo-store-fs = { workspace = true }
tempfile         = { workspace = true }

[features]
# Enable `KnowledgeStore::query_in_subgraph` (pulls in gonzalo-graph).
graph = ["dep:gonzalo-graph"]

[lints]
workspace = true
