[package]
name = "gonzalo-vector"
description = "Vector-search capability layer for gonzalo (embeddings keyed by RecordKey)"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
repository.workspace = true

[dependencies]
gonzalo-core = { workspace = true }
async-trait  = { workspace = true }
hnsw_rs = { version = "0.3.4", optional = true }

[dev-dependencies]
tokio = { workspace = true }

[lints]
workspace = true

[features]
# Approximate ANN backend (`HnswVectorIndex`), off by default so the exact
# `MemoryVectorIndex` stays the zero-dependency default (ADR 0014).
hnsw = ["dep:hnsw_rs"]
